<!DOCTYPE html>
<html>
<head>
    <title>Remote Desktop Viewer</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a1a;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #status {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 20px;
            background: rgba(0,0,0,0.8);
            color: white;
            border-radius: 5px;
            z-index: 1000;
            font-size: 14px;
        }
        #status.connected {
            background: rgba(76, 175, 80, 0.9);
        }
        #status.disconnected {
            background: rgba(244, 67, 54, 0.9);
        }
        #screen-container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
        }
        #screen {
            max-width: 100%;
            max-height: 100vh;
            cursor: crosshair;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }
        #loading {
            color: white;
            font-size: 24px;
        }
        .controls {
            position: fixed;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 15px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="status" class="disconnected">Connecting...</div>
    <div class="controls">
        <strong>🎮 Remote Control</strong><br>
        <small>Room: {{ room_id }}</small>
    </div>
    <div id="screen-container">
        <img id="screen" style="display:none" />
        <div id="loading">Waiting for screen share...</div>
    </div>

    <script>
        const roomId = "{{ room_id }}";
        const status = document.getElementById('status');
        const screen = document.getElementById('screen');
        const loading = document.getElementById('loading');
        
        const socket = io({
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: Infinity,
            timeout: 20000,
            transports: ['websocket', 'polling'],
            upgrade: true,
            rememberUpgrade: true
        });

        let isConnected = false;
        let frameCount = 0;

        socket.on('connect', () => {
            console.log('✅ Connected to server');
            isConnected = true;
            status.textContent = '🟢 Connected';
            status.className = 'connected';
            
            socket.emit('join_room', { room_id: roomId });
        });

        socket.on('disconnect', (reason) => {
            console.log('❌ Disconnected:', reason);
            isConnected = false;
            status.textContent = '🔴 Disconnected - Reconnecting...';
            status.className = 'disconnected';
        });

        socket.on('connect_error', (error) => {
            console.log('Connection error:', error);
            status.textContent = '⚠️ Connection Error';
        });

        socket.on('joined_room', (data) => {
            console.log('👀 Joined room:', data.room_id);
            status.textContent = '🟢 Viewing Screen';
        });

        socket.on('screen_update', (data) => {
            frameCount++;
            screen.src = 'data:image/jpeg;base64,' + data.frame;
            screen.style.display = 'block';
            loading.style.display = 'none';
            
            if (frameCount % 30 === 0) {
                status.textContent = `🟢 Live (${frameCount} frames)`;
            }
        });

        // Throttled mouse tracking (60 FPS max)
        let lastMouseMove = 0;
        screen.addEventListener('mousemove', (e) => {
            const now = Date.now();
            if (now - lastMouseMove < 16) return;
            lastMouseMove = now;
            
            const rect = screen.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * screen.naturalWidth;
            const y = ((e.clientY - rect.top) / rect.height) * screen.naturalHeight;
            
            socket.emit('control_mouse_move', {
                room_id: roomId,
                x: x,
                y: y,
                screen_width: screen.naturalWidth,
                screen_height: screen.naturalHeight
            });
        });

        screen.addEventListener('mousedown', (e) => {
            e.preventDefault();
            const button = e.button === 0 ? 'left' : e.button === 2 ? 'right' : 'middle';
            socket.emit('control_mouse_click', {
                room_id: roomId,
                button: button,
                type: 'single'
            });
        });

        screen.addEventListener('dblclick', (e) => {
            e.preventDefault();
            const button = e.button === 0 ? 'left' : 'right';
            socket.emit('control_mouse_click', {
                room_id: roomId,
                button: button,
                type: 'double'
            });
        });

        screen.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        screen.addEventListener('wheel', (e) => {
            e.preventDefault();
            socket.emit('control_mouse_scroll', {
                room_id: roomId,
                delta: e.deltaY > 0 ? -1 : 1
            });
        });

        // Keyboard control - BLOCK dangerous keys
        document.addEventListener('keydown', (e) => {
            // Block dangerous keys
            const blockedKeys = ['Control', 'Alt', 'Meta', 'OS', 'Win'];
            if (blockedKeys.includes(e.key)) {
                console.log('Blocked key:', e.key);
                return;
            }
            
            e.preventDefault();
            socket.emit('control_key_press', {
                room_id: roomId,
                key: e.key
            });
        });

        // Keep connection alive
        setInterval(() => {
            if (isConnected) {
                socket.emit('ping');
            }
        }, 25000);
    </script>
</body>
</html>
